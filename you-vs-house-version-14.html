<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You vs. House Dice</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#eef1f7,#10131b);--surface:light-dark(#fff,#1a1e28);--surface2:light-dark(#f5f7fb,#121620);--text:light-dark(#151923,#f5f7ff);--muted:light-dark(#626a7c,#aab1c2);--border:light-dark(#dce1eb,#303746);--accent:light-dark(#151923,#fff);--accentText:light-dark(#fff,#11131a)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background:var(--bg);padding:32px 20px 40px;display:grid;place-items:center}@keyframes wheelSpin{from{transform:rotate(0deg)}to{transform:rotate(1800deg)}}#wheel.spinning{animation:wheelSpin 2.5s cubic-bezier(.12,.8,.18,1) forwards}.wheel-button{position:relative;z-index:5;pointer-events:auto}.wheel-section{display:block!important;visibility:visible!important;opacity:1!important}
.game{width:min(720px,100%);text-align:center}.eyebrow{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--muted);margin-bottom:8px}h1{font-size:clamp(38px,7vw,62px);line-height:1;margin:0;letter-spacing:-2px}header p{color:var(--muted);margin:12px 0 28px}.dice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:20px;border:1px solid var(--border);border-radius:22px;background:var(--surface)}.card h2{margin:0 0 14px}.die{height:170px;display:grid;place-items:center;background:var(--surface2);font-size:0;font-weight:900;position:relative}.die::before{content:"";width:112px;height:98px;background:var(--accent);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:6px;box-shadow:0 7px 14px #0003}.die::after{content:attr(data-value);position:absolute;color:var(--accentText);font-size:48px;font-weight:900;transform:translateY(14px)}.die.rolling::before{animation:tetraRoll .65s ease-in-out infinite}.die.rolling::after{animation:numberFlash .65s ease-in-out infinite;content:""}.die.rolling{opacity:.9}@keyframes tetraRoll{0%,100%{transform:rotate(0deg) scale(1)}25%{transform:rotate(90deg) scale(.86)}50%{transform:rotate(180deg) scale(1)}75%{transform:rotate(270deg) scale(.86)}}@keyframes numberFlash{0%,100%{opacity:1}50%{opacity:.2}}.roll{margin:22px 0 12px;padding:15px 34px;border:0;border-radius:14px;background:var(--accent);color:var(--accentText);font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 5px 16px #0002}.roll:active{transform:scale(.97)}.result{min-height:34px;margin:12px 0 22px;font-size:24px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--border);border-radius:15px;background:var(--surface)}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{font-size:24px}.wheel-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.wheel-stat{padding:12px;border:1px solid var(--border);border-radius:15px;background:var(--surface2)}.wheel-stat span{display:block;color:var(--muted);font-size:13px}.wheel-stat strong{font-size:22px}.note{color:var(--muted);font-size:13px;line-height:1.5;margin-top:18px}@media(max-width:500px){.dice-grid{gap:10px}.die{height:130px}.stats{gap:7px}.stat{padding:11px}.wheel-stats{gap:7px}.wheel-stat{padding:10px}}
</style>
</head>
<body><div id="app"><main class="game">
<div class="eyebrow">🎲 DICE GAME</div><h1>You vs. House</h1><header><p>Roll two 4-sided dice. Higher number wins. No ties.</p></header>
<section class="dice-grid"><article class="card"><h2>You</h2><div id="youDie" class="die" data-value="?"></div></article><article class="card"><h2>House 🏠</h2><div id="houseDie" class="die" data-value="?"></div></article></section>
<button id="rollButton" class="roll">Roll 4-Sided Dice</button><p id="result" class="result">Ready to roll!</p>
<section class="stats"><div class="stat"><span>You</span><strong id="youWins">0</strong></div><div class="stat"><span>House</span><strong id="houseWins">0</strong></div><div class="stat"><span>Rounds</span><strong id="rounds">0</strong></div></section>
<section class="card wheel-section" style="margin-top:26px"><h2>🎡 Spin the Wheel</h2><p>Give the wheel a spin!</p><div id="wheel" style="position:relative;width:min(260px,70vw);aspect-ratio:1;margin:18px auto;border-radius:50%;border:8px solid var(--surface2);background:conic-gradient(#151923 0deg 45deg,#fff 45deg 90deg,#151923 90deg 135deg,#fff 135deg 180deg,#151923 180deg 225deg,#fff 225deg 270deg,#151923 270deg 315deg,#fff 315deg 360deg);transition:transform 2.5s cubic-bezier(.12,.8,.18,1);box-shadow:0 8px 24px #0003"><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;transform:rotate(22.5deg) translateY(-76px)">YOU</span><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#151923;transform:rotate(67.5deg) translateY(-76px)">HOUSE</span><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;transform:rotate(112.5deg) translateY(-76px)">YOU</span><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#151923;transform:rotate(157.5deg) translateY(-76px)">HOUSE</span><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;transform:rotate(202.5deg) translateY(-76px)">YOU</span><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#151923;transform:rotate(247.5deg) translateY(-76px)">HOUSE</span><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;transform:rotate(292.5deg) translateY(-76px)">YOU</span><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#151923;transform:rotate(337.5deg) translateY(-76px)">HOUSE</span></div><button id="spinButton" type="button" class="roll wheel-button">Spin Wheel</button><p id="wheelResult" class="result">Ready to spin!</p><section class="wheel-stats"><div class="wheel-stat"><span>You</span><strong id="wheelYouWins">0</strong></div><div class="wheel-stat"><span>House</span><strong id="wheelHouseWins">0</strong></div><div class="wheel-stat"><span>Spins</span><strong id="wheelSpins">0</strong></div></section></section>
</main></div>
<script>
const youDie=document.getElementById('youDie'),houseDie=document.getElementById('houseDie'),button=document.getElementById('rollButton'),result=document.getElementById('result'),youWinsEl=document.getElementById('youWins'),houseWinsEl=document.getElementById('houseWins'),roundsEl=document.getElementById('rounds');let youWins=0,houseWins=0,rounds=0;
function d4(){return Math.floor(Math.random()*4)+1}
function round(){if(button.disabled)return;button.disabled=true;youDie.classList.add('rolling');houseDie.classList.add('rolling');result.textContent='Rolling...';setTimeout(()=>{const house=Math.random()<.60;let winner,loser;if(house){winner=d4();if(winner===1)winner=2;loser=Math.floor(Math.random()*(winner-1))+1;houseDie.dataset.value=winner;youDie.dataset.value=loser;houseWins++;result.textContent='House wins! 🏠'}else{winner=d4();if(winner===1)winner=2;loser=Math.floor(Math.random()*(winner-1))+1;youDie.dataset.value=winner;houseDie.dataset.value=loser;youWins++;result.textContent='You win! 🎉'}youDie.classList.remove('rolling');houseDie.classList.remove('rolling');rounds++;youWinsEl.textContent=youWins;houseWinsEl.textContent=houseWins;roundsEl.textContent=rounds;button.disabled=false},650)}
button.addEventListener('click',round);
const wheel=document.getElementById('wheel'),spinButton=document.getElementById('spinButton'),wheelResult=document.getElementById('wheelResult'),wheelYouWinsEl=document.getElementById('wheelYouWins'),wheelHouseWinsEl=document.getElementById('wheelHouseWins'),wheelSpinsEl=document.getElementById('wheelSpins');let wheelYouWins=0,wheelHouseWins=0,wheelSpins=0;spinButton.addEventListener('click',()=>{if(spinButton.disabled)return;spinButton.disabled=true;wheelResult.textContent='Spinning...';wheel.classList.remove('spinning');void wheel.offsetWidth;wheel.classList.add('spinning');setTimeout(()=>{wheel.classList.remove('spinning');const house=Math.random()<.6;if(house){wheelHouseWins++;wheelResult.textContent='House! 🏠'}else{wheelYouWins++;wheelResult.textContent='You! 🎉'}wheelSpins++;wheelYouWinsEl.textContent=wheelYouWins;wheelHouseWinsEl.textContent=wheelHouseWins;wheelSpinsEl.textContent=wheelSpins;spinButton.disabled=false},2500)});
</script></body></html>
